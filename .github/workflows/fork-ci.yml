name: Fork CI

on:
  push:
    branches:
      - import/upstream-3.3.7
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-build:
    name: Test and build (Go 1.26, Linux amd64)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
          cache: true

      - name: Verify Go formatting
        run: |
          files="$(gofmt -l $(git ls-files '*.go'))"
          if [ -n "$files" ]; then
            echo "$files"
            exit 1
          fi

      - name: Verify shell scripts
        run: bash -n install.sh wattun-manager

      - name: Run tests
        run: go test -timeout 20m ./...

      - name: Build release payload
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o dist/wattun ./cmd/wattun
          cp install.sh wattun-manager dist/
          chmod 755 dist/install.sh dist/wattun-manager dist/wattun
          cd dist
          sha256sum wattun > wattun.sha256
          sha256sum wattun install.sh wattun-manager > SHA256SUMS
          cd ..

      - name: Upload unsigned release payload
        uses: actions/upload-artifact@v4
        with:
          name: wattunnel-linux-amd64-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
