name: Fork CI

on:
  push:
    branches:
      - import/upstream-3.3.7
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-build:
    name: Test and build (Go 1.26)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
          cache: true

      - name: Verify formatting
        run: |
          files="$(gofmt -l $(git ls-files '*.go'))"
          if [ -n "$files" ]; then
            echo "$files"
            exit 1
          fi

      - name: Run tests
        run: go test ./...

      - name: Build wattun
        run: go build -trimpath -ldflags="-s -w" -o dist/wattun ./cmd/wattun
